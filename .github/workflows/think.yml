name: Think from Issue Label

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to analyze with the Think agent'
        required: true
        type: string

permissions:
  contents: read
  issues: write
  actions: write
  pull-requests: read

jobs:
  think:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       github.event.issue.state == 'open' &&
       github.event.label.name != '' &&
       (github.event.label.name == 'think' ||
        github.event.label.name == 'plan' ||
        github.event.label.name == 'code' ||
        github.event.label.name == 'release'))
    uses: 1pizzateam/coding-pal/.github/workflows/pipeline-think.yml@main
    with:
      issue_number: ${{ inputs.issue_number || github.event.issue.number }}
      project_title: BumpR
    secrets: inherit
