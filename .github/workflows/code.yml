name: Pipeline - Code

on:
  workflow_dispatch:
    inputs:
      workflow_run_id:
        description: 'Upstream run containing the specification artifact (pipeline handoff)'
        required: false
        type: string
      issue_number:
        description: 'Issue number to implement from plan.md'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: delivery-${{ github.repository }}
  cancel-in-progress: false
  queue: max

jobs:
  code:
    uses: 1pizzateam/coding-pal/.github/workflows/pipeline-code.yml@main
    with:
      issue_number: ${{ inputs.issue_number || '' }}
      workflow_run_id: ${{ inputs.workflow_run_id || '' }}
      project_title: BumpR
    secrets: inherit

  prove:
    needs: code
    if: needs.code.outputs.continue_to_prove == 'true'
    uses: 1pizzateam/coding-pal/.github/workflows/pipeline-prove.yml@main
    with:
      workflow_run_id: ${{ github.run_id }}
      project_title: BumpR
    secrets: inherit
