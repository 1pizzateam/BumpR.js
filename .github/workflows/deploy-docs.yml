name: Deploy Docs to GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - 'website/**'
      - 'src/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy-docs:
    uses: 1pizzateam/coding-pal/.github/workflows/pipeline-deploy-docs.yml@main
    secrets: inherit
