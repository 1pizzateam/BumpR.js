name: Pipeline - Prove

on:
  workflow_dispatch:
    inputs:
      workflow_run_id:
        description: 'Upstream run containing the specification artifact (pipeline handoff)'
        required: false
        type: string
      pr_number:
        description: 'Pull request number to validate (optional)'
        required: false
        type: string
      issue_number:
        description: 'Issue number whose open PR should be validated (optional)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: delivery-${{ github.repository }}
  cancel-in-progress: false
  queue: max

jobs:
  prove:
    uses: 1pizzateam/coding-pal/.github/workflows/pipeline-prove.yml@main
    with:
      pr_number: ${{ inputs.pr_number || '' }}
      issue_number: ${{ inputs.issue_number || '' }}
      workflow_run_id: ${{ inputs.workflow_run_id || '' }}
      project_title: BumpR
      auto_release_npm: true
    secrets: inherit
