name: Pipeline - Plan

on:
  workflow_dispatch:
    inputs:
      workflow_run_id:
        description: 'Upstream run containing the specification artifact (pipeline handoff)'
        required: false
        type: string
      issue_number:
        description: 'Issue number to plan (must already have think.md)'
        required: false
        type: string

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  plan:
    uses: 1pizzateam/coding-pal/.github/workflows/pipeline-plan.yml@main
    with:
      issue_number: ${{ inputs.issue_number || '' }}
      workflow_run_id: ${{ inputs.workflow_run_id || '' }}
      project_title: BumpR
    secrets: inherit
